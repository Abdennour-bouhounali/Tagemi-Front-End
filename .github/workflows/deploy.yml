name: Deploy Vite React Frontend to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Vite React app
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$OCTENIUM_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
        env:
          OCTENIUM_KEY: ${{ secrets.OCTENIUM_KEY }}

      - name: Deploy to VPS
        env:
          OCTENIUM_HOST: ${{ secrets.OCTENIUM_HOST }}
          OCTENIUM_USER: ${{ secrets.OCTENIUM_USER }}
          OCTENIUM_SSH_PORT: ${{ secrets.OCTENIUM_SSH_PORT }}
        run: |
          # Use rsync to copy dist/ to public_html
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -p ${OCTENIUM_SSH_PORT:-22}" --delete dist/ $OCTENIUM_USER@$OCTENIUM_HOST:/var/www/Tagemi-Front-End/public_html/
